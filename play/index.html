<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6a00">
  <title>Play HAVOK</title>
  <meta name="description" content="Join the HAVOK server — Rust Survival on MTA: San Andreas.">
  <link rel="canonical" href="https://havokrust.xyz/play/">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HAVOK — Rust Survival">
  <meta property="og:title" content="Play HAVOK — join the server">
  <meta property="og:description" content="One click opens MTA straight into the HAVOK server. First time? The step-by-step is here.">
  <meta property="og:url" content="https://havokrust.xyz/play/">
  <meta property="og:image" content="https://havokrust.xyz/og.jpg?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="HAVOK logo over a forest at sunset">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Play HAVOK — join the server">
  <meta name="twitter:image" content="https://havokrust.xyz/og.jpg?v=2">
  <link rel="icon" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0e0d0c; --panel: #1b1815; --card: #221d19; --line: #2f2822; --text: #ece7e1; --muted: #a2978c; --dim: #6f665d; --accent: #ff6a00; --radius: 10px; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: radial-gradient(ellipse at 50% 0%, rgba(255, 106, 0, .14), transparent 60%), var(--bg); color: var(--text); font: 16px/1.6 'Barlow', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    main { width: 100%; max-width: 560px; text-align: center; }
    .logo { width: min(420px, 90%); height: auto; margin: 0 auto 26px; display: block; }
    h1 { font: 600 clamp(26px, 6vw, 36px)/1.15 'Oswald', sans-serif; letter-spacing: .02em; margin: 0 0 10px; text-transform: uppercase; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: 0 0 24px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 28px; border-radius: var(--radius); background: var(--accent); color: #140a02; font-weight: 700; font-size: 17px; text-decoration: none; border: 0; cursor: pointer; }
    .btn:hover { filter: brightness(1.08); }
    .addr { margin: 26px auto 0; display: flex; align-items: center; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .addr code { font: 600 15px ui-monospace, monospace; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; border-radius: 8px; }
    .ghost { min-height: 42px; padding: 0 16px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); color: var(--text); font: 600 14px 'Barlow', sans-serif; cursor: pointer; }
    .ghost:hover { border-color: var(--accent); }
    .steps { margin: 34px 0 0; padding: 20px 22px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
    .steps b { display: block; font: 600 13px 'Barlow', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .steps ol { margin: 0; padding-left: 20px; color: var(--text); }
    .steps li { margin: 4px 0; }
    .links { margin-top: 26px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-weight: 600; }
    .links a { text-decoration: none; color: var(--muted); }
    .links a:hover { color: var(--accent); }
    .off { color: var(--dim); }
    .demo-tag { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 4px; background: #f5b83d; color: #140a02; font: 700 12px/1.3 system-ui, sans-serif; letter-spacing: .04em; text-align: center; max-width: calc(100% - 32px); }
</style>
</head>
<body>
  <main>
    <img class="logo" src="../logo-text.png" alt="HAVOK">
    <h1 data-t="title">Abrindo o <span>MTA</span>…</h1>
    <p data-t="sub">Se o jogo não abrir sozinho, clique no botão abaixo.</p>
    <a class="btn" id="join" href="#"><span data-t="btn">Entrar no servidor</span></a>
    <div class="addr" id="addrBox">
      <code id="addr"></code>
      <button class="ghost" id="copy" type="button" data-t="copy">Copiar IP</button>
    </div>
    <div class="steps">
      <b data-t="first">Primeira vez?</b>
      <ol>
        <li data-t="s1">Tenha o GTA San Andreas (PC) instalado.</li>
        <li><span data-t="s2">Baixe e instale o</span> <a href="https://multitheftauto.com/" target="_blank" rel="noopener">Multi Theft Auto</a>.</li>
        <li data-t="s3">Volte aqui e clique em "Entrar no servidor".</li>
      </ol>
    </div>
    <div class="links">
      <a href="../" data-t="wiki">Wiki</a>
      <a href="../#/store" data-t="store">Loja VIP</a>
      <a id="discord" href="#" target="_blank" rel="noopener">Discord</a>
    </div>
  </main>
  <script src="../config.js"></script>
  <script>
    (function () {
      var H = window.HAVOK || {};
      var server = H.server || '';
      // play/?demo: mostra a página com um IP de exemplo (203.0.113.x é reservado para documentação, não existe)
      var demo = /[?&]demo\b/.test(location.search);
      if (demo) server = '203.0.113.10:22003';
      var en = !/^pt/i.test(navigator.language || '');
      var T = {
        title: 'Opening <span>MTA</span>…', sub: 'If the game does not open by itself, click the button below.', btn: 'Join the server',
        copy: 'Copy IP', copied: 'Copied!', first: 'First time?', s1: 'Have GTA San Andreas (PC) installed.', s2: 'Download and install',
        s3: 'Come back here and click "Join the server".', wiki: 'Wiki', store: 'VIP Store', soon: 'Server address coming soon.'
      };
      if (en) {
        document.documentElement.lang = 'en';
        document.querySelectorAll('[data-t]').forEach(function (el) { if (T[el.dataset.t]) el.innerHTML = T[el.dataset.t]; });
      }
      var discord = document.getElementById('discord');
      if (H.discord) discord.href = H.discord; else discord.remove();

      if (!server) {
        document.querySelector('h1').innerHTML = 'HAVOK';
        document.querySelector('p').textContent = en ? T.soon : 'O endereço do servidor sai em breve.';
        document.getElementById('join').remove();
        document.getElementById('addrBox').remove();
        return;
      }
      var url = 'mtasa://' + server;
      document.getElementById('join').href = url;
      document.getElementById('addr').textContent = server;
      document.getElementById('copy').onclick = function () {
        var b = this;
        (navigator.clipboard ? navigator.clipboard.writeText(server) : Promise.reject()).then(function () {
          b.textContent = en ? T.copied : 'Copiado!';
        }, function () {});
      };
      if (demo) {
        var tag = document.createElement('div');
        tag.className = 'demo-tag';
        tag.textContent = en ? 'PREVIEW — example address, not the real server' : 'PRÉVIA — endereço de exemplo, não é o servidor real';
        document.body.appendChild(tag);
        return; // na prévia não tenta abrir o MTA
      }
      setTimeout(function () { location.href = url; }, 600);
    })();
  </script>
</body>
</html>
