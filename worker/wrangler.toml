name = "havok-waitlist"
main = "waitlist.js"
compatibility_date = "2026-10-01"

[vars]
GUILD_ID = "1560345146703482890"
ROLE_ID = "1561050122446569643"   # cargo "Waiting List"
GOAL = "125"
ALLOWED_ORIGINS = "https://havokrust.xyz,https://www.havokrust.xyz,http://127.0.0.1:8080,http://localhost:8080"

